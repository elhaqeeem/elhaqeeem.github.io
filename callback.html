<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OAuth Callback</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/daisyui@2.50.0/dist/full.css" rel="stylesheet" type="text/css" />

    <script>
        // Menangkap parameter dari URL
        function getQueryParams() {
            let params = {};
            let queryString = window.location.search.substring(1);
            let regex = /([^&=]+)=([^&]*)/g, match;
            while (match = regex.exec(queryString)) {
                params[decodeURIComponent(match[1])] = decodeURIComponent(match[2]);
            }
            return params;
        }

        window.onload = function() {
            let params = getQueryParams();
            document.getElementById("code").textContent = params['code'] || "No code received";
            document.getElementById("state").textContent = params['state'] || "No state token";
        };
    </script>
</head>
<body class="bg-base-200 flex items-center justify-center min-h-screen">
    <div class="bg-white p-6 rounded-lg shadow-lg max-w-md w-full">
        <h1 class="text-2xl font-bold mb-4 text-center">OAuth Callback</h1>
        <p class="mb-4 text-gray-700">Google OAuth telah mengirimkan kode otentikasi berikut:</p>
        <p class="font-semibold mb-2"><strong>Code:</strong> <span id="code" class="text-accent"></span></p>
        <p class="font-semibold"><strong>State:</strong> <span id="state" class="text-accent"></span></p>
    </div>
</body>
</html>
